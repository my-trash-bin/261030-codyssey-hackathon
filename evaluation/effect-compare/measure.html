<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>덜어쓰기 효과 측정</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#111827;font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px}
.card{background:#fff;border:1px solid #dce4f0;border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
pre{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin:0;font:13.5px/1.6 Consolas,monospace}
textarea{width:100%;min-height:300px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:14px/1.6 "Malgun Gothic",sans-serif}
button{font:inherit;font-weight:700;padding:8px 16px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
button:disabled{opacity:.5;cursor:default}
label{display:block;margin:6px 0}
input[type=text],input[type=number],select{font:inherit;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.muted{color:#64748b;font-size:13px}
.warn{color:#b91c1c;font-weight:700}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:#dbeafe;color:#1e40af;font-size:13px;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>덜어쓰기 효과 측정 <span class="tag" id="progress"></span></h1>
  <div id="app"></div>
</main>
<script>
'use strict';
const app = document.getElementById('app');
const state = { cases: [], queue: [], index: 0, participant: '', mode: 'none' };
const esc = text => String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const seconds = ms => Math.round(ms / 100) / 10;

// A조: 홀수 사례 직접·짝수 사례 SafeHandoff. B조는 반대. 두 사람이 합쳐 10건씩 채우고 같은 로그를 두 번 보지 않는다.
function buildQueue(group, count) {
  return state.cases.slice(0, count).map((item, position) => {
    const odd = position % 2 === 0;
    return { item, method: (group === 'A') === odd ? 'direct' : 'safehandoff' };
  });
}

function start() {
  document.getElementById('progress').textContent = '';
  app.innerHTML = `<div class="card">
    <h2>시작 전</h2>
    <p>전부 가상 자료입니다. 두 사람이 A조와 B조를 하나씩 맡으면 각 사례가 두 방식으로 한 번씩 측정됩니다.</p>
    <p class="muted">완료 기준은 두 방식 모두 같습니다: 수신자가 조사를 시작할 수 있고, 공개하면 안 되는 내용이 없다고 본인이 판단한 문의문.</p>
    <label>참여자 이름 <input type="text" id="who"></label>
    <label>조 <select id="group"><option>A</option><option>B</option></select></label>
    <label>사례 수 <select id="count"><option value="10">10건 (본 측정)</option><option value="3">3건 (예비 측정)</option></select></label>
    <p id="core" class="muted">앱 연결 확인 중…</p>
    <div class="bar"><button class="primary" id="go">측정 시작</button></div></div>`;
  fetch('/core').then(r => r.json()).then(core => {
    const real = core.implementation === 'real' && core.connection === 'direct' && core.ready === true;
    state.mode = real ? 'real' : 'fake';
    document.getElementById('core').innerHTML = real
      ? '실제 앱·모델 연결 확인됨.'
      : '<span class="warn">실제 앱이 아닙니다. 리허설만 가능하며 이 결과는 슬라이드에 반영되지 않습니다.</span>';
  }).catch(() => {
    state.mode = 'fake';
    document.getElementById('core').innerHTML = '<span class="warn">앱에 연결하지 못했습니다. just app을 먼저 실행하세요.</span>';
  });
  document.getElementById('go').onclick = () => {
    state.participant = document.getElementById('who').value.trim();
    if (!state.participant) return;
    state.queue = buildQueue(document.getElementById('group').value, Number(document.getElementById('count').value));
    state.index = 0;
    next();
  };
}

function next() {
  if (state.index >= state.queue.length) {
    document.getElementById('progress').textContent = '완료';
    app.innerHTML = '<div class="card"><h2>이 조의 측정이 끝났습니다.</h2><p>두 조가 모두 끝나면 <code>node tools/effect-measure.mjs apply</code>를 실행하세요. 3건 예비 측정이면 뒤에 <code>--partial</code>을 붙입니다.</p></div>';
    return;
  }
  document.getElementById('progress').textContent = `${state.index + 1} / ${state.queue.length}`;
  const task = state.queue[state.index];
  app.innerHTML = `<div class="card"><h2>${task.method === 'direct' ? '직접 준비' : '덜어쓰기'} · ${esc(task.item.id)}</h2>
    <p>목적: ${esc(task.item.purpose)} / 수신처: ${esc(task.item.recipient)}</p>
    <div class="bar"><button class="primary" id="begin">시간 재기 시작</button></div></div>`;
  document.getElementById('begin').onclick = () => (task.method === 'direct' ? direct(task) : safehandoff(task));
}

function direct(task) {
  const started = performance.now();
  app.innerHTML = `<div class="grid">
    <div class="card"><h2>원본 로그</h2><pre>${esc(task.item.log)}</pre></div>
    <div class="card"><h2>공유할 문의문을 직접 작성하세요</h2>
      <textarea id="text">${esc(task.item.log)}</textarea>
      <div class="bar"><button class="primary" id="done">완료</button><button id="drop">포기</button></div></div></div>`;
  const finish = status => score(task, { status, text: document.getElementById('text').value,
    person: performance.now() - started, wait: 0, total: performance.now() - started, revisions: 0, mode: 'none' });
  document.getElementById('done').onclick = () => finish('completed');
  document.getElementById('drop').onclick = () => finish('abandoned');
}

function safehandoff(task) {
  const started = performance.now();
  let wait = 0;
  let revisions = -1;
  let mode = state.mode;
  const items = task.item.candidates.map(fact => `<label><input type="checkbox" value="${esc(fact.id)}"> ${esc(fact.text)}</label>`).join('');
  app.innerHTML = `<div class="grid">
    <div class="card"><h2>원본 로그</h2><pre>${esc(task.item.log)}</pre>
      <h2 style="margin-top:14px">공개를 승인할 사실을 고르세요</h2><div id="facts">${items}</div>
      <div class="bar"><button class="primary" id="make">초안 만들기</button><span id="status" class="muted"></span></div></div>
    <div class="card"><h2>초안 확인·수정</h2><textarea id="text" placeholder="초안이 여기에 나옵니다"></textarea>
      <div class="bar"><button class="primary" id="done">완료</button><button id="drop">포기</button></div></div></div>`;
  const status = document.getElementById('status');
  document.getElementById('make').onclick = async event => {
    const chosen = task.item.candidates.filter(fact => document.querySelector(`#facts input[value="${fact.id}"]`).checked);
    if (!chosen.length) { status.textContent = '하나 이상 고르세요.'; return; }
    event.target.disabled = true;
    status.textContent = '모델 대기 중…';
    const before = performance.now();
    try {
      const reply = await fetch('/sharing', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ purpose: task.item.purpose, recipient: task.item.recipient,
          facts: chosen.map(fact => ({ id: fact.id, text: fact.text })) }) });
      const body = await reply.json();
      if (!reply.ok) throw new Error(body?.error?.code ?? body?.error ?? String(reply.status));
      document.getElementById('text').value = `${body.document.title}\n\n${body.document.body}`;
      const real = body.provenance?.implementation === 'real' && body.provenance?.connection === 'direct';
      if (!real) mode = 'fake';
      revisions += 1;
      status.textContent = '초안 생성됨. 다시 고르면 재생성합니다.';
    } catch (error) {
      status.innerHTML = `<span class="warn">실패: ${esc(error.message)}. 다시 시도하거나 포기하세요.</span>`;
    }
    wait += performance.now() - before;
    event.target.disabled = false;
  };
  const finish = result => {
    const total = performance.now() - started;
    score(task, { status: result, text: document.getElementById('text').value, person: total - wait,
      wait, total, revisions: Math.max(revisions, 0), mode });
  };
  document.getElementById('done').onclick = () => finish('completed');
  document.getElementById('drop').onclick = () => finish('abandoned');
}

function score(task, run) {
  const found = task.item.forbidden.filter(word => run.text.includes(word));
  const clues = task.item.required.map(clue => `<label><input type="checkbox" value="${esc(clue.id)}"> ${esc(clue.text)}</label>`).join('');
  app.innerHTML = `<div class="grid">
    <div class="card"><h2>최종본 (채점 시간은 측정에 들어가지 않습니다)</h2><pre>${esc(run.text)}</pre></div>
    <div class="card"><h2>문자열로 찾은 공개 금지 항목: ${found.length}개</h2>
      <p class="muted">${found.map(esc).join(', ') || '없음'}</p>
      <label>문자열로 안 잡혔지만 드러난 금지 정보 수 <input type="number" id="extra" min="0" value="0" style="width:80px"></label>
      <h2 style="margin-top:14px">최종본에 남아 있는 필수 단서를 체크하세요</h2><div id="clues">${clues}</div>
      <div class="bar"><button class="primary" id="save">저장하고 다음</button></div></div></div>`;
  document.getElementById('save').onclick = async () => {
    const kept = document.querySelectorAll('#clues input:checked').length;
    await fetch('/record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      case_id: task.item.id, method: task.method, mode: run.mode, participant: state.participant,
      measured_at: new Date().toISOString(), person_seconds: seconds(run.person), wait_seconds: seconds(run.wait),
      total_seconds: seconds(run.total), leaks: found.length + Number(document.getElementById('extra').value || 0),
      missing_clues: task.item.required.length - kept, revisions: run.revisions, status: run.status }) });
    state.index += 1;
    next();
  };
}

fetch('/cases').then(r => r.json()).then(data => { state.cases = data.cases; start(); });
</script>
</body>
</html>
