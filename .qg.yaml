presets: [js]
# just check invokes QG; pnpm test runs Node tests without invoking QG.
hooks:
  preCommit:
    installation: off
artifacts:
  generated:
    include:
      - evaluation/**
      - var/**
      - bin/**
      - contracts/openapi.json
      - contracts/*.v1.schema.json
      - packages/*/dist/**
rules:
  package/allowed-name:
    severity: error
    options:
      allowedPatterns: ["^(safehandoff|@safehandoff/[a-z][a-z0-9-]*)$"]
  markdown/allowed-characters:
    severity: error
    options:
      allowedLanguages: [en, ko]
      ignoredPaths: [var/**, bin/**]
      allowedCharacters: ["·", "→", "–", "‘", "’", "§", "—", "“", "”", "×", "∩", "…"]
  docs/valid-reference:
    severity: error
    options:
      ignoredPaths: [var/**, bin/**]
  files/max-bytes:
    severity: error
    options:
      ignoredDirectories: [.git, .local, .qg, node_modules, dist, var, bin]
  files/max-line-length:
    severity: error
    options:
      ignoredDirectories: [.git, .local, .qg, node_modules, dist, var, bin]
  files/max-lines:
    severity: error
    options:
      ignoredDirectories: [.git, .local, .qg, node_modules, dist, var, bin]
  files/max-files-per-directory:
    severity: error
    options:
      ignoredDirectories: [.git, .local, .qg, node_modules, dist, var, bin]
overrides:
  - files: [docs/traceability.csv]
    rules:
      files/max-line-length: [error, {limit: 650}]
checks:
  - name: TypeScript types
    command: mise
    args: [exec, --, pnpm, typecheck]
    message: Fix TypeScript type errors.
  - name: Package builds
    command: mise
    args: [exec, --, pnpm, build]
    message: Fix the server or client build.
  - name: Node and QG policy tests
    command: mise
    args: [exec, --, pnpm, test]
    message: Fix Node tests without bypassing the quality rules.
