presets: [js]
# just check invokes QG; pnpm test runs Node tests without invoking QG.
hooks:
  preCommit:
    installation: auto
artifacts:
  generated:
    include:
      - docs/presentation/SafeHandoff_발표자료_통합.html
      - docs/demo-media/**
      - var/**
      - bin/**
      - contracts/openapi.json
      - contracts/*.v1.schema.json
      - packages/*/dist/**
rules:
  package/allowed-name:
    severity: error
    options:
      allowedPatterns: ["^(safehandoff|@safehandoff/[a-z][a-z0-9-]*)$"]
  markdown/allowed-characters:
    severity: error
    options:
      allowedLanguages: [en, ko]
      ignoredPaths: [var/**, bin/**]
  docs/valid-reference:
    severity: error
    options:
      ignoredPaths: [var/**, bin/**]
  files/max-bytes:
    severity: error
    options:
      ignoredPaths: [docs/demo-media/SafeHandoff-demo.mp4]
      ignoredDirectories: [.git, .local, .qg, node_modules, dist, var, bin]
  files/max-line-length:
    severity: error
    options:
      ignoredDirectories: [.git, .local, .qg, node_modules, dist, var, bin]
  files/max-lines:
    severity: error
    options:
      ignoredDirectories: [.git, .local, .qg, node_modules, dist, var, bin]
  files/max-files-per-directory:
    severity: error
    options:
      ignoredDirectories: [.git, .local, .qg, node_modules, dist, var, bin]
overrides:
  # 로컬 PDF 빌드 산출물은 Git 추적·크기 검사 대상에서 제외한다.
  - files: [docs/presentation/*.pdf]
    rules:
      files/max-bytes: off
  - files: [docs/presentation/*.html]
    rules:
      files/max-line-length: [error, {limit: 1600}]

  - files: [docs/qa/traceability.csv]
    rules:
      files/max-line-length: [error, {limit: 650}]
  # 통합 HTML은 개별 슬라이드에서 재생성하는 배포 산출물이다.
  - files: [docs/presentation/SafeHandoff_발표자료_통합.html]
    rules:
      files/max-lines: [error, {limit: 10000}]
checks:
  - name: TypeScript types
    command: mise
    args: [exec, --, pnpm, typecheck]
    message: Fix TypeScript type errors.
  - name: Package builds
    command: mise
    args: [exec, --, pnpm, build]
    message: Fix the server or client build.
  - name: Node and QG policy tests
    command: mise
    args: [exec, --, pnpm, test]
    message: Fix Node tests without bypassing the quality rules.
