[tools]
node = "24.21.0"
pnpm = "10.13.1"
just = "1.58.0"
python = "3.13.8"
go = "1.27.3"


# just가 없는 첫 실행도 mise 자체로 설치할 수 있다.
[tasks.setup]
description = "고정 도구와 pnpm 의존성 설치"
run = ["pnpm install --frozen-lockfile", "pnpm exec qg hooks install"]

[tasks.setup-presentation]
description = "발표 빌드 도구와 Chromium 설치"
depends = ["setup"]
run = "pnpm exec playwright install chromium"

[tasks.setup-presentation-system]
description = "Chromium Linux 시스템 의존성 설치 (관리자 권한이 필요할 수 있음)"
depends = ["setup"]
run = "pnpm exec playwright install-deps chromium"
