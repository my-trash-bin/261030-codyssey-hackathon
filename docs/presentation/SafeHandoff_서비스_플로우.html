:root{

*{box-sizing:border-box}
html{

body{

h1,h2,h3,h4,p,figure{margin:0}
h1,h2,h3,h4{line-height:1.32;letter-spacing:-.035em}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

.toolbar{
  height:64px;
  position:sticky;
  top:0;
  z-index:30;
  background:#fffffff7;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.toolbar-inner{
  height:100%;
  width:min(1280px,calc(100% - 40px));
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}
.brand{
  font-size:19px;
  font-weight:900;
  color:var(--navy);

  white-space:nowrap;

.brand-badge{

  color:#fff;

  font-weight:900;
}
.brand small{
  font-size:11px;
  letter-spacing:.08em;
  font-weight:700;
  margin-left:4px;
  color:var(--muted);
}
.tools{display:flex;gap:9px;align-items:center}
.tool-button{
  font-size:12px;
  font-weight:700;
  color:var(--navy);
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:8px;
  padding:7px 14px;
  line-height:1.5;
  text-decoration:none;
}
.tool-button:hover{background:#f0f5ff}

.reader{padding:28px 0 42px}
.page-shell{
  position:relative;
  margin:0 auto 28px;
  width:1280px;
  height:720px;
}
.page{
  position:relative;
  width:1280px;
  height:720px;
  padding:24px 44px 20px;
  background:var(--paper);
  box-shadow:0 6px 28px #16317212;
  transform-origin:top left;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.page-header{
  border-bottom:2.5px solid var(--navy);
  padding-bottom:10px;
  margin-bottom:12px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  flex-shrink:0;
}
.page-header h2{
  font-size:30px;
  color:var(--ink);
  font-weight:900;
  letter-spacing:-.04em;
  white-space:nowrap;
}
.header-sub{
  font-size:12.5px;
  font-weight:700;
  color:var(--muted);
  padding-bottom:2px;
  white-space:nowrap;
}

.wireflow-canvas{
  flex:1;
  min-height:0;
  background:var(--canvas);
  border:1.5px solid #d5deec;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.wireflow-canvas svg{
  width:100%;
  height:100%;
  display:block;
}
.wireflow-canvas svg text{
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
}

.st{
  display:inline-block;
  padding:1px 7px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:800;
  line-height:1.4;
  white-space:nowrap;
  vertical-align:1px;
}
.st-demo{background:#dcfce7;color:#166534}
.st-built{background:#dbeafe;color:#1e40af}
.st-plan{background:#e2e8f0;color:#475569}

@media(max-width:760px){
  .toolbar-inner{width:calc(100% - 24px)}
  .reader{padding:16px 0 25px}
  .page-shell{width:calc(100% - 24px)!important;height:auto!important;margin-bottom:16px}

  .page-header{flex-direction:column;align-items:flex-start;gap:6px}
  .page-header h2{font-size:22px;white-space:normal}
  .header-sub{white-space:normal}
  .wireflow-canvas{overflow-x:auto}
  .wireflow-canvas svg{min-width:960px;height:auto}
}

@media print{
  @page{size:1280px 720px;margin:0}
  body{background:#fff;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar{display:none!important}
  .reader{padding:0;margin:0}
  .page-shell{width:1280px!important;height:720px!important;margin:0!important}
  .page{width:1280px!important;height:720px!important;transform:none!important;box-shadow:none!important;overflow:hidden!important}

<script>
(() => {
  'use strict';
  const shells = Array.from(document.querySelectorAll('.page-shell'));
  function fitPages() {
    const mobile = innerWidth <= 760;
    const width = Math.min(1280, innerWidth - 40);
    shells.forEach(shell => {
      shell.style.width = mobile ? '' : width + 'px';
      shell.style.height = mobile ? '' : 720 * width / 1280 + 'px';
      shell.querySelector('.page').style.transform = mobile ? '' : 'scale(' + width / 1280 + ')';
    });
  }
  document.getElementById('print-document').addEventListener('click', () => window.print());
  window.addEventListener('resize', fitPages);
  window.addEventListener('afterprint', fitPages);
  fitPages();
})();
</script>
