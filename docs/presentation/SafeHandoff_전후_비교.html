<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163172">
<meta name="description" content="박지훈의 SafeHandoff 사용 스토리보드 - 서비스 시작부터 조사 가능한 문의문 전달까지의 가상 시나리오">
<title>SafeHandoff · 3. 해결 솔루션 / 유저 플로우</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563eb;
  --navy:#163172;
  --ink:#111827;
  --body:#334155;
  --muted:#64748b;
  --line:#dce4f0;
  --paper:#ffffff;
}
*{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body{
  margin:0;
  background:#e8edf5;
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;
  font-weight:600;
  line-height:1.45;
  word-break:keep-all;
  overflow-wrap:break-word;
}
h1,h2,h3,h4,p,figure,ul{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

.toolbar{
  height:64px;
  position:sticky;
  top:0;
  z-index:30;
  background:#fffffff7;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.toolbar-inner{
  height:100%;
  width:min(1280px,calc(100% - 40px));
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}
.brand{
  font-size:19px;
  font-weight:900;
  color:var(--navy);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:8px;
}
.brand-badge{
  display:inline-grid;
  place-items:center;
  width:26px;
  height:26px;
  border-radius:7px;
  background:#0f9f90;
  color:#fff;
  font-size:14px;
  font-weight:900;
}
.brand small{
  font-size:11px;
  letter-spacing:.08em;
  font-weight:700;
  margin-left:4px;
  color:var(--muted);
}
.tools{display:flex;gap:8px;align-items:center}
.tool-button{
  font-size:12px;
  font-weight:700;
  color:var(--navy);
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:8px;
  padding:7px 13px;
  line-height:1.5;
}
.tool-button:hover{background:#f0f5ff}

.reader{padding:28px 0 42px}
.page-shell{
  position:relative;
  margin:0 auto 28px;
  width:1280px;
  height:720px;
}
.page{
  position:relative;
  width:1280px;
  height:720px;
  padding:28px 46px 24px;
  background:var(--paper);
  box-shadow:0 6px 28px #16317212;
  transform-origin:top left;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.page-header{
  border-bottom:2px solid var(--navy);
  padding-bottom:12px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  flex-shrink:0;
}
.page-header h2{
  font-size:30px;
  color:var(--ink);
  font-weight:900;
  letter-spacing:-.04em;
}
.header-sub{
  font-size:13px;
  font-weight:700;
  color:var(--muted);
  white-space:nowrap;
}

.page-header{margin-bottom:14px}
.storyboard{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:14px 16px;
}
.scene{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  margin:0;
  border:1.5px solid var(--line);
  border-radius:11px;
  background:#fff;
  overflow:hidden;
}
.scene-art{position:relative;flex:1;min-height:0;overflow:hidden;background:#f1f5fa}
.story-sheet{position:absolute;max-width:none;width:300%;height:auto;left:calc(var(--col)*-100%);top:0;transform:translateY(calc(var(--row)*-50%))}
.speech{position:absolute;z-index:1;top:10px;left:12px;max-width:calc(100% - 24px);padding:5px 10px;border:1px solid #dce4f0;border-radius:12px;background:#fffffff5;color:var(--navy);font-size:13px;font-weight:800;line-height:1.4;letter-spacing:-.02em}
.scene-copy{flex:0 0 83px;padding:10px 13px 9px;background:#fff}
.scene h3{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:900;letter-spacing:-.035em;line-height:1.35;margin-bottom:5px}
.scene h3 span{display:inline-grid;place-items:center;width:23px;height:23px;flex-shrink:0;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:800}
.scene-copy p{font-size:14px;line-height:1.5;color:var(--body);font-weight:600;letter-spacing:-.02em}
.scene-copy b{font-weight:800;color:var(--navy)}
.story-note{flex-shrink:0;margin-top:8px;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}

@media(max-width:760px){
  .toolbar-inner{width:calc(100% - 24px)}
  .reader{padding:16px 0 25px}
  .page-shell{width:calc(100% - 24px)!important;height:auto!important;margin-bottom:16px}
  .page{width:100%;height:auto;padding:20px 16px;transform:none!important;overflow:visible}
  .page-header{flex-direction:column;align-items:flex-start}
  .header-sub{white-space:normal}
  .grid-collapse{grid-template-columns:1fr!important}
  .storyboard{grid-template-rows:none}
  .scene-art{flex:none;aspect-ratio:2/1}
  .scene-copy{flex-basis:auto}
}

@media print{
  @page{size:1280px 720px;margin:0}
  body{background:#fff;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar{display:none!important}
  .reader{padding:0;margin:0}
  .page-shell{width:1280px!important;height:720px!important;margin:0!important}
  .page{width:1280px!important;height:720px!important;transform:none!important;box-shadow:none!important;overflow:hidden!important}
}
</style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="#after"><span class="brand-badge">S</span>SafeHandoff <small>3 · STORYBOARD</small></a>
    <div class="tools">
      <a class="tool-button" href="SafeHandoff_문제_딜레마.html">‹ 2. 페르소나·문제 정의</a>
      <a class="tool-button" href="SafeHandoff_서비스_차별점.html">4. 서비스 차별점 ›</a>
      <a class="tool-button" href="../spec.md">제품 설계</a>
      <a class="tool-button" href="../../README.md">실제 구현</a>
      <button class="tool-button" id="print-document" type="button">인쇄 / PDF 저장</button>
    </div>
  </div>
</header>

<main class="reader" aria-label="SafeHandoff 3. 해결 솔루션 / 유저 플로우">
  <div class="page-shell" id="sheet-after">
    <section class="page" id="after" aria-labelledby="after-title">
      <header class="page-header">
        <h2 id="after-title">해결 솔루션 / 유저 플로우</h2>
        <span class="header-sub">서비스로 달라진 문의 준비 · 가상 시나리오</span>
      </header>
      <div class="storyboard grid-collapse" aria-label="서비스 시작부터 조사 가능한 문의문 전달까지 여섯 장면">
        <figure class="scene">
          <div class="scene-art" role="img" aria-label="지훈이 SafeHandoff에서 새 문의를 열고 목적과 원자료를 사내에 입력한다">
            <img class="story-sheet" style="--col:0;--row:0" src="storyboard_jihun_v2.webp" alt="">
            <span class="speech">“공급사 문의 자료를 준비하자.”</span>
          </div>
          <figcaption class="scene-copy">
            <h3><span>1</span> SafeHandoff에서 문의를 시작한다</h3>
            <p>목적은 ‘첫 요청 처리 확인’. <b>원본 로그는 사내 작업 공간에 둔다.</b></p>
          </figcaption>
        </figure>
        <figure class="scene">
          <div class="scene-art" role="img" aria-label="서비스가 조사 단서와 민감 정보를 나눠 제안하고 지훈이 살펴본다">
            <img class="story-sheet" style="--col:1;--row:0" src="storyboard_jihun_v2.webp" alt="">
            <span class="speech">“필요한 단서부터 살펴보자.”</span>
          </div>
          <figcaption class="scene-copy">
            <h3><span>2</span> AI가 제안한 조사 단서를 살핀다</h3>
            <p>서비스가 <b>요청 ID·응답 순서</b>와 민감 정보를 나눠 보여준다.</p>
          </figcaption>
        </figure>
        <figure class="scene">
          <div class="scene-art" role="img" aria-label="지훈이 필요한 조사 단서를 체크하고 민감 정보는 공개 범위에서 제외한다">
            <img class="story-sheet" style="--col:2;--row:0" src="storyboard_jihun_v2.webp" alt="">
            <span class="speech">“요청 ID와 응답 순서는 필요해.”</span>
          </div>
          <figcaption class="scene-copy">
            <h3><span>3</span> 지훈이 공개할 사실을 고른다</h3>
            <p><b>op_demo_101과 시도별 응답</b>은 남기고, 민감 정보는 공개 범위에서 제외한다.</p>
          </figcaption>
        </figure>
        <!-- // TODO: [PRES-12] 아래 AI 작성·검토 장면은 가상 시나리오 그림이며 실제 모델 실행 증거가 아니다. -->
        <figure class="scene">
          <div class="scene-art" role="img" aria-label="사내 AI가 승인한 사실만 받아 새로운 문의문을 작성한다">
            <img class="story-sheet" style="--col:0;--row:1" src="storyboard_jihun_v2.webp" alt="">
            <span class="speech">승인한 사실로 새 문의문 작성</span>
          </div>
          <figcaption class="scene-copy">
            <h3><span>4</span> 사내 AI가 문의문을 새로 쓴다</h3>
            <p>승인한 사실로 작성하고, 첫 요청의 처리 완료·중복 생성 여부는 <b>미확인</b>으로 남긴다.</p>
          </figcaption>
        </figure>
        <figure class="scene">
          <div class="scene-art" role="img" aria-label="지훈이 AI의 검토를 마친 문의문에서 조사 단서와 공개 정보를 최종 확인한다">
            <img class="story-sheet" style="--col:1;--row:1" src="storyboard_jihun_v2.webp" alt="">
            <span class="speech">“빠진 단서나 민감 정보는 없나?”</span>
          </div>
          <figcaption class="scene-copy">
            <h3><span>5</span> 지훈이 초안을 최종 확인한다</h3>
            <p>AI가 승인 사실과 대조한 초안을 보고, 지훈이 <b>단서와 공개 범위</b>를 확인한다.</p>
          </figcaption>
        </figure>
        <figure class="scene">
          <div class="scene-art" role="img" aria-label="지훈이 확정본만 직접 공유하자 공급사가 요청 ID를 기준으로 조사에 착수한다">
            <img class="story-sheet" style="--col:2;--row:1" src="storyboard_jihun_v2.webp" alt="">
            <span class="speech">“이 요청 ID로 기록을 확인할게요.”</span>
          </div>
          <figcaption class="scene-copy">
            <h3><span>6</span> 공급사가 요청 기록을 확인한다</h3>
            <p>지훈이 <b>확정본만 직접 공유</b>하자, 공급사는 요청 ID를 기준으로 조사에 착수한다.</p>
          </figcaption>
        </figure>
      </div>
      <p class="story-note">가상 사용 시나리오를 설명하는 그림이며 실제 모델 실행·외부 발송 결과가 아닙니다.</p>
    </section>
  </div>
</main>

<script>
(() => {
  'use strict';
  const shells = Array.from(document.querySelectorAll('.page-shell'));
  function fitPages() {
    const mobile = innerWidth <= 760;
    const width = Math.min(1280, innerWidth - 40);
    shells.forEach(shell => {
      shell.style.width = mobile ? '' : width + 'px';
      shell.style.height = mobile ? '' : 720 * width / 1280 + 'px';
      shell.querySelector('.page').style.transform = mobile ? '' : 'scale(' + width / 1280 + ')';
    });
  }
  document.getElementById('print-document').addEventListener('click', () => window.print());
  window.addEventListener('resize', fitPages);
  window.addEventListener('afterprint', fitPages);
  fitPages();
})();
</script>
</body>
</html>
